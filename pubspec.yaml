name: thaheen_task
description: "Arabic-first mini offline learning app with local video and persisted progress."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  go_router: ^18.0.1
  equatable: ^3.0.0
  hive_flutter: ^1.1.0
  video_player: ^2.14.0
  chewie: ^1.17.2
  logger: ^2.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/data/
    - assets/videos/
